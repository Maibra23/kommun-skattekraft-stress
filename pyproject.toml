[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skattekraftspanelen"
version = "0.1.0"
description = "Where Sweden's 290 kommuner stand in tax base against the national average, which way they are moving, and what explains the difference. Streamlit dashboard over SCB data."
requires-python = ">=3.11,<3.12"
dependencies = [
    "requests",
    "pandas>=2.0",
    "pyarrow",
    "linearmodels>=6.0",
    "statsmodels>=0.14",
    "streamlit>=1.30",
    "plotly>=5.0",
    "folium",
    "branca",
    "streamlit-folium",
]

[project.optional-dependencies]
dev = [
    "pytest",
    # Screenshots the dashboard for visual review; see
    # scripts/screenshot_dashboard.py and docs/screenshots/README.md.
    "playwright",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = []
