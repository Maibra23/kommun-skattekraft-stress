[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kommun-skattekraft-stress"
version = "0.1.0"
description = "Two-way fixed-effects panel model of Swedish municipal tax base growth with Streamlit dashboard."
requires-python = ">=3.11,<3.12"
dependencies = [
    "requests",
    "pandas>=2.0",
    "pyarrow",
    "linearmodels>=6.0",
    "statsmodels>=0.14",
    "streamlit>=1.30",
    "plotly>=5.0",
    "folium",
    "branca",
    "streamlit-folium",
]

[project.optional-dependencies]
dev = [
    "pytest",
    # Screenshots the dashboard for visual review; see
    # scripts/screenshot_dashboard.py and docs/screenshots/README.md.
    "playwright",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "baseline: locks the 2026-09-04 pre-remediation audit findings (see docs/REMEDIATION_PLAN.md T0.3)",
]
